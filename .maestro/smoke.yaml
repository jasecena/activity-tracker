# Smoke test — does the built app actually launch and run?
#
# This is the only test that exercises the real binary on a real iOS runtime.
# Jest can prove the segmentation logic is right; it cannot tell you the app
# crashes on launch because of a native module, a missing Info.plist key or a
# keychain call that throws. That is what this catches, and it runs before the
# TestFlight upload.
#
# Deliberately shallow. Deep UI assertions belong in the Jest component suite,
# which is faster, runs on Linux and does not flake.
#
# What it cannot cover: anything involving actual movement. A simulator has no
# GPS, and background location does not survive backgrounding there. Every claim
# about segmentation is asserted in `npx jest --selectProjects core` instead —
# which is the reason the engine is pure TypeScript.
#
# ---------------------------------------------------------------------------
# EVERY STRING BELOW IS AN ACCESSIBILITY LABEL, NOT THE TEXT ON SCREEN.
#
# Maestro reads the accessibility tree, and iOS *collapses* an element that has
# an `accessibilityLabel` — its children stop existing as far as XCUITest is
# concerned. So the notice that reads "Tracking is off" over two lines of body
# text is one element labelled `Start tracking`, and the tile showing "0 m"
# under the word DISTANCE is one element labelled `Distance: 0 m`. Asserting on
# what you can see in a screenshot is how the v0.1.0 release failed: the app was
# rendering perfectly and the flow was looking for text nothing exposes.
#
# Matches are also whole-string, not fragments. To find the real label for
# something, run the flow, then read
# `.maestro/tests/*/smoke/screen-hierarchy/*.json` from the uploaded artifact —
# `accessibilityText` is the field that matters.
# ---------------------------------------------------------------------------
#
# ${APP_ID} is substituted by the CI job from vars.IOS_BUNDLE_IDENTIFIER.

appId: ${APP_ID}
---
- launchApp:
    clearState: true

# **The app opens on the Planner, which is the first tab.** It is a web page on
# a machine over the VPN, and a simulator has neither — so what is asserted is
# that the tab exists, draws its own header, and steps aside cleanly. Not
# loading is the ordinary state here and the flow proves the app survives it
# rather than proving the page arrives.
- assertVisible: 'Planner tab'
- assertVisible: 'Reload the planner'
# Everything below is about the rest of the app, so step off it. Day is where
# the app used to open and where the flow has always started.
- tapOn: 'Day tab'

# --- Launched, and rendering a fresh install ------------------------------
#
# The header is a bare Text with `accessibilityRole="header"`, so it is exposed
# as itself. The subtitle proves the timeline hook resolved rather than hanging
# on the store read.
# The Day screen has no header bar. The day arrows, the date and the way into
# the day list are one row, and the date itself is the button — so this is the
# label of a Pressable, not a heading.
- assertVisible: 'Today. Choose another day'

# The tracking notice. Labelled by its Pressable, so this string — not the
# "Tracking is off" heading inside it — is what exists.
- assertVisible: 'Start tracking'

# The timeline is a collapsed section, so its contents are not on screen until
# the heading is tapped. That is the whole point of it — the Day screen is the
# map and the player, with the timeline underneath — and it is why this flow has
# to open it rather than assert into a closed drawer.
#
# The diary is no longer here at all: it is a tab, asserted further down.
#
# **This is what failed the v0.6.2 release.** The sections shipped, the Jest
# suite was updated for them, and this flow was not; it asserted on text that had
# become invisible-but-rendered. Maestro caught what Jest could not — the
# difference between "the component renders that string" and "a person can see
# it" — which is exactly the job this file exists to do.
- tapOn: 'TIMELINE'

# The vault generated a key and the store round-tripped. If the keychain call or
# the cipher threw, the app would be stuck before this renders — the timeline is
# derived from the fix buffer, which comes out of the sealed store.
#
# This carries a job that used to belong to a row of stat tiles reading
# `Distance: 0 m` and `Calories: 0`. Those are gone: the Day screen is the map
# and what happened on it, not a scoreboard.
- assertVisible: 'Nothing recorded yet today.'

# --- Nothing is conjured out of nothing -----------------------------------
#
# There is no Record button. Tracking is either on or it is not, and a journey
# exists because fixes were recorded — never because something was pressed.
#
# A simulator does not move, so on a fresh install the day is genuinely empty
# and stays that way. That *is* the assertion: the previous version of this flow
# pressed Record and asserted a row appeared, which is precisely the fiction
# that put a journey on the wrong day at a time that had not arrived.
- assertVisible: 'Nothing recorded yet today.'

# --- The other tabs render ------------------------------------------------
# Worth the extra seconds: these screens pull in the icon font, the SVG renderer
# and the settings store, and a missing native module shows up as a blank screen
# here rather than as a crash on launch.
# The day view is the app's front page and mounts the offline map canvas — SVG,
# the projection, the scale bar. With maps off (the default) it must render
# without MapKit being involved at all.
- assertVisible: 'Today. Choose another day'

# Every day, one tap away. Today and History used to be separate tabs; they were
# both "look at a day" and are one screen now, with the list as its page.
- tapOn: 'Today. Choose another day'
- assertVisible: 'All days'
- tapOn: 'Back'
- assertVisible: 'Today. Choose another day'

# Capture is the one screen that touches the camera, and the only place a
# missing native module would surface as a blank rectangle rather than a crash.
# Deliberately does NOT press the shutter: that writes a file and, on a fresh
# install, raises the permission dialog, which has no Maestro affordance here.
# The viewfinder fills the screen, so there is no header to assert on — the
# shutter is what proves it came up. Deliberately does NOT press it: that writes
# a file and, on a fresh install, raises the permission dialog, which has no
# Maestro affordance here.
#
# **And deliberately does not touch Voice or Video.** Selecting either asks iOS
# for the microphone the moment the mode changes, and the system alert that
# follows covers the app — every assertion after it then fails on an element
# that is rendered and not visible. That is what failed the v0.2.7 release: the
# flow tapped Voice and looked for the shutter behind the dialog. The earlier
# version got away with tapping Voice only because it asserted nothing
# afterwards, which is a check that cannot fail rather than a check that
# passes. Switching modes is covered in the Jest suite, where no dialog exists.
- tapOn: 'Capture tab'
- assertVisible: 'Take photo'

# The zoom buttons are *absent* here on purpose, and asserting that is worth
# more than it sounds: a simulator reports no cameras, so the optics module
# returns nothing, the dial is null and no stop is drawn. This is the assertion
# that the local Swift module degrades rather than crashing when the hardware
# will not answer — the failure mode a native module has that a JS one does not.
#
# The label is generated per stop from the real lens data, so this fails the
# moment the dial starts inventing stops the phone did not report.
- assertNotVisible: 'Zoom to 1x, 24 millimetres'

# Media mounts expo-video and expo-audio, and on a fresh install has nothing to
# show. The empty state is the assertion worth having: it proves the media index
# was read and decrypted rather than the screen hanging on the store.
- tapOn: 'Media tab'
- assertVisible: 'Media'
- assertVisible: 'Nothing captured yet'

# The diary is its own tab, fourth, before Settings. A note used to be filed
# under the day it was about and reached by walking to that day; it is one list
# now, newest first. Empty on a fresh install, which is the assertion that proves
# the note store was read and decrypted rather than the screen hanging on it.
#
# Also the tab that mounts react-native-gesture-handler. A missing root view
# shows up as a screen that renders and a swipe that never fires, so getting the
# screen up at all is what this catches.
- tapOn: 'Notes tab'
- assertVisible: 'Notes'
- assertVisible: 'Nothing written yet. Tap the microphone to say something, or the pen to write it.'
# The quick microphone, bottom centre, which writes a note out of a recording
# with no sheet in between. Asserted because it is the tab's reason for being
# reached in a hurry — and because a control that is rendered but off screen is
# exactly what Jest cannot tell from one that is visible, which is the whole
# reason this file exists. It sits at the bottom edge, not below it, so a bare
# assertVisible is right here where 'Raw data & export' needed a scroll.
- assertVisible: 'Record a voice note'

# **The two lists, and the switch between them.** A plan is a `DayNote` with a
# different `kind` rather than a second store, and this switch is both the way
# between them and the mode the microphone writes in — press it under Plans and
# what you say is filed as a plan. Asserted here because Jest cannot tell a
# control that rendered from one that is actually on screen, and this one sits
# above the scroller where a mis-measured header would push it under the
# navigation bar.
#
# Both cells are labelled '<name>, N entries', built in `NoteKindSwitch`. Change
# that string and this must change with it — the same contract each preset row
# in Settings already has.
- assertVisible: 'Notes, 0 entries'
- tapOn: 'Plans, 0 entries'
# The empty line is per list rather than shared: the diary's says to write
# something, and this one says what a plan is for.
- assertVisible: 'No plans yet. Tap the microphone to say what you want to happen.'
- tapOn: 'Notes, 0 entries'
- assertVisible: 'Nothing written yet. Tap the microphone to say something, or the pen to write it.'

# The gallery's own gestures and panels cannot be reached here: `clearState`
# leaves nothing captured, and a simulator has no camera to capture with — so
# the media rules are asserted in the Jest suite instead
# (`verticalIntent.test.ts`, `MediaGalleryScreen.test.tsx`). What this proves is
# the tab mounts expo-video and expo-audio without a native module missing.

# **Settings is not a tab any more.** It is a gear at the top left of the Notes
# header, opening a page above it — a tab is for somewhere you go several times a
# day, and this is somewhere you go twice and then not for a month. The flow is
# already on Notes from the section above, so this is one press.
- tapOn: 'Settings'
- assertVisible: 'Settings'
- assertVisible: 'Track my day'
# Each preset row is one collapsed element labelled "<name>. <detail>", built in
# services/location.ts. Change a preset's `detail` and this must change with it.
- assertVisible: 'Balanced. ~10 m accuracy, a point every 25 m'
- assertVisible: 'Battery saver. ~100 m accuracy, a point every 100 m'

# The one switch in the app that permits a network request. It must be off on a
# fresh install — that is the whole design, and a default that silently flipped
# would be the most consequential regression this app could ship.
- scrollUntilVisible:
    element:
      text: 'Show routes on a map'
    direction: DOWN
- assertVisible: 'Off — routes are drawn without tiles'
# --- Everything below the fold, one scroll per row --------------------------
#
# **This used to be a single scroll to the bottom, and that is what kept
# breaking it.** The idea was sound — scroll past the rows you want, then tap
# them where they sit comfortably above the last element — and it held for as
# long as the distance between the DATA card and the bottom of Settings did not
# change. Three releases have now failed because it did:
#
#   v0.2.0  adding the Places row pushed 'Raw data & export' down to bounds
#           ending at y=788 with the tab bar starting at 786. The tap reported
#           success and the screen never changed.
#   v0.13.0 the same thing at the other end: 'Erase everything' was flush with
#           the bottom, the tap landed on the tab bar's middle button, and the
#           flow carried on from the Media tab.
#   v0.14.0 the opposite direction. Credentials moved three sections out of
#           Settings and added a row, so Settings got *shorter* and the DATA
#           card grew — and one scroll to the bottom now overshoots far enough
#           that 'Places', the first row, is off the top. The screenshot at the
#           failure shows the card starting at 'Named journeys'.
#
# Three failures, three different geometries, one cause: a tap whose position
# depends on how much unrelated content happens to sit around it.
#
# So each row now gets its own `scrollUntilVisible` with `centerElement: true`
# immediately before it is tapped. Centring is what makes this independent of
# the layout: the row is put in the middle of the screen, nowhere near either
# edge, and how many rows precede it stops mattering. Upstream gives up
# centring after five tries and falls back to plain visibility, which is its
# deliberate handling of a target at the end of a list that has stopped
# scrolling — so this cannot hang.
#
# **Order matters and is not arbitrary.** `direction: DOWN` reveals what is
# below, so a target above the current position is never found. These are
# listed in the order they appear on the screen, and every page returns to the
# scroll position it left, so each step only ever scrolls forwards.
#
# The assertion after each `Back` is a *neighbouring* row rather than the one
# just visited: 'Places' is both the Settings row and the title of the page it
# opens, so asserting it proves nothing about which of the two is on screen.
# A neighbour appears on Settings and nowhere else.

- scrollUntilVisible:
    element:
      text: 'Places'
    direction: DOWN
    centerElement: true
    # **No `speed` override.** 80 was added when Settings was long enough that
    # the default budget ran out mid-scroll; Credentials took three sections out
    # of it and that is no longer true. A fast swipe overshoots the centre and
    # burns the five centring tries, which lands back on the plain-visibility
    # fallback this whole section exists to stop relying on — and upstream's own
    # tuning advice is to reduce speed above 50 for precision. The generous
    # timeout stays, because it is a ceiling paid only when something is broken.
    timeout: 60000
# Places lost its tab to Replay and Capture, so this is also what proves the
# page stack still reaches it. The sort controls exercise the place store, and
# they are what is asserted on rather than 'Places' itself.
- tapOn: 'Places'
- assertVisible: 'Sort by Time spent'
- tapOn: 'Sort by Visits'
- tapOn: 'Sort by Name'
- tapOn: 'Sort by Time spent'
- tapOn: 'Back'
- assertVisible: 'Named journeys'

# Named journeys is where the label store is exercised. Empty on a fresh
# install, which is what it should say rather than showing nothing at all.
- scrollUntilVisible:
    element:
      text: 'Named journeys'
    direction: DOWN
    centerElement: true
    # **No `speed` override.** 80 was added when Settings was long enough that
    # the default budget ran out mid-scroll; Credentials took three sections out
    # of it and that is no longer true. A fast swipe overshoots the centre and
    # burns the five centring tries, which lands back on the plain-visibility
    # fallback this whole section exists to stop relying on — and upstream's own
    # tuning advice is to reduce speed above 50 for precision. The generous
    # timeout stays, because it is a ceiling paid only when something is broken.
    timeout: 60000
- tapOn: 'Named journeys'
- assertVisible: 'Nothing named yet. Open a journey from the timeline and give it a name.'
- tapOn: 'Back'
- assertVisible: 'Raw data and export'

# --- The raw data page opens ----------------------------------------------
# Exercises the page stack and the counts. Deliberately does NOT tap an export
# button: that opens the iOS share sheet, which has no Maestro affordance and
# would hang the run waiting for a human.
- scrollUntilVisible:
    element:
      text: 'Raw data and export'
    direction: DOWN
    centerElement: true
    # **No `speed` override.** 80 was added when Settings was long enough that
    # the default budget ran out mid-scroll; Credentials took three sections out
    # of it and that is no longer true. A fast swipe overshoots the centre and
    # burns the five centring tries, which lands back on the plain-visibility
    # fallback this whole section exists to stop relying on — and upstream's own
    # tuning advice is to reduce speed above 50 for precision. The generous
    # timeout stays, because it is a ceiling paid only when something is broken.
    timeout: 60000
- tapOn: 'Raw data and export'
- assertVisible: 'Raw data'
- assertVisible: 'Route points (all history): 0'

# The backup button, which must be *present and disabled* on a fresh install:
# there is no bucket and no passphrase, so there is nothing it could do.
#
# Deliberately not pressed. It would make a real request to a real bucket,
# which a smoke test has no business doing — and with nothing configured it
# cannot anyway.
- scrollUntilVisible:
    element:
      text: 'Back up now'
    direction: DOWN
    centerElement: true
    # **No `speed` override.** 80 was added when Settings was long enough that
    # the default budget ran out mid-scroll; Credentials took three sections out
    # of it and that is no longer true. A fast swipe overshoots the centre and
    # burns the five centring tries, which lands back on the plain-visibility
    # fallback this whole section exists to stop relying on — and upstream's own
    # tuning advice is to reduce speed above 50 for precision. The generous
    # timeout stays, because it is a ceiling paid only when something is broken.
    timeout: 60000
- assertVisible: 'Back up now'
- tapOn: 'Back'
- assertVisible: 'Credentials'

# --- Credentials opens ------------------------------------------------------
# The backup bucket, the plans bucket and the transcription key. These three
# sections were most of the length of Settings itself; they are the part you set
# once and never touch, so they moved to their own page.
#
# Deliberately types nothing. Every field here writes to the encrypted store on
# blur, and a smoke test that put junk in a credential field would leave a fresh
# install configured with it.
- scrollUntilVisible:
    element:
      text: 'Credentials'
    direction: DOWN
    centerElement: true
    # **No `speed` override.** 80 was added when Settings was long enough that
    # the default budget ran out mid-scroll; Credentials took three sections out
    # of it and that is no longer true. A fast swipe overshoots the centre and
    # burns the five centring tries, which lands back on the plain-visibility
    # fallback this whole section exists to stop relying on — and upstream's own
    # tuning advice is to reduce speed above 50 for precision. The generous
    # timeout stays, because it is a ceiling paid only when something is broken.
    timeout: 60000
- tapOn: 'Credentials'
- assertVisible: 'Backup bucket'
- assertVisible: 'Plans bucket'
- tapOn: 'Back'
- assertVisible: 'Check connections'

# --- The connection checks open -------------------------------------------
# Asserted on 'Run the checks' rather than on 'Check connections', which is also
# the row just tapped and would stay visible either way.
#
# Deliberately NOT pressed. It would make four real requests to ElevenLabs and
# to two real buckets, which a smoke test has no business doing — and on a fresh
# install every check returns 'off' without a request anyway, so pressing it
# would prove less than it costs.
- scrollUntilVisible:
    element:
      text: 'Check connections'
    direction: DOWN
    centerElement: true
    # **No `speed` override.** 80 was added when Settings was long enough that
    # the default budget ran out mid-scroll; Credentials took three sections out
    # of it and that is no longer true. A fast swipe overshoots the centre and
    # burns the five centring tries, which lands back on the plain-visibility
    # fallback this whole section exists to stop relying on — and upstream's own
    # tuning advice is to reduce speed above 50 for precision. The generous
    # timeout stays, because it is a ceiling paid only when something is broken.
    timeout: 60000
- tapOn: 'Check connections'
- assertVisible: 'Run the checks'
- tapOn: 'Back'
- assertVisible: 'Credentials'

# --- Erase is present and asks first --------------------------------------
# The one irreversible action in the app — it destroys the encryption key. It
# must never be a single tap.
#
# Centred like every other tap here, and this is the one that taught the lesson:
# `getVisiblePercentage` measures against the *device screen*, not the scroll
# view, and iOS reports a layout frame for content clipped below the viewport —
# so a button under the tab bar reads as fully visible and the tap goes to the
# tab bar. See the v0.13.0 note above.
- scrollUntilVisible:
    element:
      text: 'Erase everything'
    direction: DOWN
    centerElement: true
    # **No `speed` override.** 80 was added when Settings was long enough that
    # the default budget ran out mid-scroll; Credentials took three sections out
    # of it and that is no longer true. A fast swipe overshoots the centre and
    # burns the five centring tries, which lands back on the plain-visibility
    # fallback this whole section exists to stop relying on — and upstream's own
    # tuning advice is to reduce speed above 50 for precision. The generous
    # timeout stays, because it is a ceiling paid only when something is broken.
    timeout: 60000
- tapOn: 'Erase everything'
- assertVisible: 'Erase everything?'
- tapOn: 'Cancel'

- tapOn: 'Day tab'
# Still an empty day after a tour of every other tab. Today was never unmounted,
# which is the guarantee that stops a timeline just derived, or a half-typed
# name, being thrown away when you glance somewhere else.
#
# Pressing the tab you are already on is also what returns to today now that the
# Today button is gone — so this second press proves the gesture rather than
# merely arriving somewhere.
- tapOn: 'Day tab'
- assertVisible: 'Today. Choose another day'

# And the timeline is *still open* from the tap near the top of this flow. A
# `Section`'s open state is local and deliberately not persisted, so it survives
# only as long as the component does — which makes this the assertion that the
# Day tab was never unmounted while every other tab was visited. That is the
# guarantee that stops a timeline just derived, or a half-typed name, being
# thrown away because you glanced somewhere else.
- assertVisible: 'Nothing recorded yet today.'
