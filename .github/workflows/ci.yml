### Continuous integration — runs on every push and pull request.
#
# Everything here runs on Linux. The timer engine is pure TypeScript precisely so
# that the checks that matter do not need a Mac, and a full verification takes
# well under a minute.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets you re-run checks without pushing an empty commit.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm

      # `npm ci` fails if package.json and package-lock.json disagree, which
      # catches a dependency added without the lockfile being updated.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm run test:ci

      - name: Upload coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  # Confirms the Expo config still resolves and that dependency versions match
  # what the installed SDK expects. Catches a broken app.config.ts here rather
  # than 15 minutes into a macOS release build.
  expo-config:
    name: Expo config & doctor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Resolve Expo config
        run: npx expo config --type public

      - name: Expo doctor
        run: npx --yes expo-doctor@latest
